[project]
name = "docpro-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Selix2002", email = "smunmuno@umag.cl" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=48.0.0",
    "google-api-python-client>=2.196.0",
    "google-auth-oauthlib>=1.4.0",
    "groq>=1.2.0",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2.3",
    "sqlalchemy>=2.0.49",
    "weasyprint>=68.1",
]

[project.scripts]
backend = "docpro_backend:main"

[tool.uv_build]
module-name = "docpro_backend"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"
