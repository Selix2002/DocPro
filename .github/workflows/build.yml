name: Build & Release DocPro

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        run: pip install uv

      - name: Instalar dependencias
        run: uv sync --all-packages

      - name: Instalar GTK3 Runtime
        run: |
          $gtkUrl = "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe"
          Invoke-WebRequest -Uri $gtkUrl -OutFile gtk3-runtime.exe
          Start-Process -FilePath "gtk3-runtime.exe" -ArgumentList "/S" -Wait

      - name: Build con PyInstaller
        run: uv run pyinstaller docpro.spec --noconfirm

      - name: Extraer versión del tag
        id: version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Crear instalador
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" docpro.iss

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "DocPro v${{ steps.version.outputs.VERSION }}"
          files: Output/DocPro-Setup-${{ steps.version.outputs.VERSION }}.exe
          generate_release_notes: true
